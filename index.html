<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Prevent mobile browsers from applying dark mode -->
    <meta name="color-scheme" content="light only" />

    <!-- Brand theme color = title bar color when Window Controls Overlay is active -->
    <meta name="theme-color" content="#008236" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#008236" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#008236" />

    <!-- Make it feel like a real app on iOS / Android -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CampusMart" />
    <meta name="application-name" content="CampusMart" />

    <!-- Reduce browser chrome / UI hints -->
    <meta name="format-detection" content="telephone=no, email=no, address=no" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />

    <title>CampusMart</title>

    <style>
      html,
      body {
        background: #ffffff !important;
        color: #111827 !important;
        color-scheme: only light !important;
        margin: 0;
        padding: 0;
        overscroll-behavior: none;
      }

      html {
        color-scheme: only light !important;
        background-color: #ffffff !important;
      }

      body {
        margin: 0;
        background-color: #ffffff !important;
        color: #111827 !important;
        -webkit-tap-highlight-color: transparent;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #ffffff;
        color: #111827;
      }

      input,
      textarea,
      select,
      button {
        color-scheme: only light !important;
      }

      /* =========================================================
         WINDOW CONTROLS OVERLAY – makes your green header the top bar
         ========================================================= */

      /* When running as installed PWA with WCO, the system title bar
         disappears and your content can draw into that area. */
      @media (display-mode: window-controls-overlay) {
        /* Your main top header (the green CampusMart bar) should use these */
        .campusmart-titlebar,
        header.top-header,
        .app-topbar {
          position: fixed;
          left: env(titlebar-area-x, 0);
          top: env(titlebar-area-y, 0);
          width: env(titlebar-area-width, 100%);
          height: env(titlebar-area-height, 48px);
          background-color: #008236 !important;
          z-index: 9999;

          /* Make the whole bar draggable so users can move the window */
          -webkit-app-region: drag;
          app-region: drag;
        }

        /* Interactive elements must NOT be draggable */
        .campusmart-titlebar a,
        .campusmart-titlebar button,
        .campusmart-titlebar input,
        .campusmart-titlebar select,
        .campusmart-titlebar [role="button"],
        header.top-header a,
        header.top-header button,
        header.top-header input,
        .app-topbar a,
        .app-topbar button,
        .app-topbar input {
          -webkit-app-region: no-drag;
          app-region: no-drag;
        }
      }

      /* Fallback for normal standalone (no WCO) */
      @media all and (display-mode: standalone) {
        html, body {
          overscroll-behavior: none;
          -webkit-overflow-scrolling: touch;
        }
      }

      /* Safe area for notched phones */
      @media all and (display-mode: standalone) {
        body {
          padding: env(safe-area-inset-top) env(safe-area-inset-right)
                   env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
  </body>
</html>
